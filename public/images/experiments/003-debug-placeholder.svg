<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <rect width="640" height="360" fill="#efe9dc"/>
  <text x="320" y="30" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a857c">What the policy learned vs intended</text>
  <circle cx="150" cy="180" r="30" fill="#d45d3a" opacity="0.6"/>
