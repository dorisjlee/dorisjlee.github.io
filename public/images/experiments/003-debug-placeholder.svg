  <path d="M180 180 L250 180" stroke="#1c1b19" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="320" cy="180" r="30" fill="#2a7a6f" opacity="0.6"/>
  <text x="320" y="240" text-anchor="middle" font-family="monospace" font-size="11" fill="#5c5850">place</text>
  <path d="M350 180 L420 180" stroke="#1c1b19" stroke-width="2"/>
  <circle cx="490" cy="180" r="30" stroke="#d45d3a" stroke-width="2" fill="none" stroke-dasharray="4"/>
